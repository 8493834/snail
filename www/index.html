<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snail</title>
<style>
  :root { --bg:#14171c; --panel:#1d2229; --line:#2c3440; --fg:#e6e9ee; --dim:#8b95a3; --accent:#6fcf97; --err:#ff7b72; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 15px system-ui, sans-serif;
         padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; }
  h1 { font-size: 18px; margin: 0; }
  #fname { flex: 1 1 8em; min-width: 0; background: transparent; color: var(--dim); border: 0;
           border-bottom: 1px dashed var(--line); font: 13px ui-monospace, Consolas, monospace; padding: 4px 2px; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
           border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.run { background: var(--accent); color: #0b1a10; border: 0; font-weight: 600; }
  button.run.stop { background: var(--err); color: #1a0b0a; }
  main { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  textarea, pre { width: 100%; margin: 0; padding: 10px; background: var(--panel); color: var(--fg);
                  border: 1px solid var(--line); border-radius: 8px; font: 13px ui-monospace, Consolas, monospace; }
  textarea { height: 42vh; min-height: 140px; resize: none; white-space: pre; tab-size: 2; }
  pre { min-height: 90px; white-space: pre-wrap; word-break: break-word; }
  #stdin { display: flex; align-items: center; gap: 8px; }
  #stdin .chev { color: var(--accent); font: 14px ui-monospace, Consolas, monospace; }
  #stdin-line { flex: 1; min-width: 0; background: var(--panel); color: var(--fg); border: 1px solid var(--accent);
                border-radius: 8px; padding: 8px 10px; font: 14px ui-monospace, Consolas, monospace; }
  #preview { display: flex; flex-direction: column; gap: 8px; }
  #preview iframe { width: 100%; height: 240px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .err { color: var(--err); }
  .dim { color: var(--dim); }
  .typed { color: var(--accent); }
</style>
</head>

<header>
  <h1>🐌 Snail</h1>

  </form>
  <div id="preview"></div>
</main>

<!-- Python runs in a background worker (web + Android + iOS) so Stop always works and the page never freezes.
     The worker's code is kept here as text and started from a Blob, so no extra file has to be shipped. -->
<script type="text/plain" id="py-worker">
"use strict";
let py = null, waiter = null;
let pending = "", pendingErr = false, timer = 0, lastFlush = 0;
const post = (m) => self.postMessage(m);

// Output is sent in small batches so a program that prints a lot can't swamp the page.
function flush() {
  if (timer) { clearTimeout(timer); timer = 0; }
  if (pending) { post({ t: "out", text: pending, err: pendingErr }); pending = ""; }
  lastFlush = Date.now();
}
const KEEP = 400000;   // same as the page's output limit: older text would be thrown away there anyway
function write(text, err) {
  if (pending && pendingErr !== err) flush();
  pending += text; pendingErr = err;
  if (pending.length > KEEP) pending = pending.slice(-KEEP);   // a runaway loop: keep only the newest text
  if (Date.now() - lastFlush >= 30) flush();                   // at most ~30 messages a second, however fast it prints
  else if (!timer) timer = setTimeout(flush, 30);
}

// Some app webviews serve .wasm files with the wrong type, which makes streaming compilation fail. Fall back to a plain download.
function installWasmFallback() {
  if (!WebAssembly.instantiateStreaming) return;
  const orig = WebAssembly.instantiateStreaming.bind(WebAssembly);
  WebAssembly.instantiateStreaming = async (source, imports) => {
    const resp = await source;
    try { return await orig(resp.clone(), imports); }
    catch (e) { return WebAssembly.instantiate(await resp.arrayBuffer(), imports); }
  };
}
const withTimeout = (p, ms, msg) =>
  Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error(msg)), ms))]);

// What Python's input() and time.sleep() call into (see the py-boot script).
const snailIO = {
  read_line() { flush(); post({ t: "need-input" }); return new Promise((resolve) => { waiter = resolve; }); },
  sleep(seconds) { flush(); return new Promise((resolve) => setTimeout(resolve, Math.max(0, seconds) * 1000)); },
  flush() { flush(); },
};

async function init(bases, boot) {
  installWasmFallback();
  let lastErr = null;
  for (let i = 0; i < bases.length && !py; i++) {
    try {
      if (i > 0) post({ t: "status", text: "bundled Python not found here; downloading it from the internet instead (needs a connection)..." });
      importScripts(bases[i] + "pyodide.js");
      py = await withTimeout(loadPyodide({ indexURL: bases[i] }), 120000, "Python took too long to start");
    } catch (e) { lastErr = e; py = null; }
  }
  if (!py) {
    throw new Error("couldn't load the Python runtime, either bundled with the app or from " + bases[bases.length - 1] +
                    ". Check your internet connection." + (lastErr ? " (" + lastErr.message + ")" : ""));
  }
  const decOut = new TextDecoder(), decErr = new TextDecoder();
  py.setStdout({ write(buf) { write(decOut.decode(buf, { stream: true }), false); return buf.length; }, isatty: true });
  py.setStderr({ write(buf) { write(decErr.decode(buf, { stream: true }), true); return buf.length; }, isatty: true });
  py.registerJsModule("snail_io", snailIO);
  py.runPython(boot);
  post({ t: "ready" });
}

async function run(code) {
  const scope = py.globals.get("dict")();   // fresh scope per block, like a separate process
  scope.set("__name__", "__main__");        // so `if __name__ == "__main__":` works
  let result;
  try {
    await py.runPythonAsync(code, { globals: scope });
    result = { t: "done", ok: true };
  } catch (e) {
    if (e && e.type === "SystemExit") result = { t: "done", ok: true };   // sys.exit() / exit() is a normal ending
    else result = { t: "done", ok: false, error: String((e && e.message) || e).trim() };
  } finally { scope.destroy(); }
  try { py.runPython("import sys\nsys.stdout.flush()\nsys.stderr.flush()"); } catch (e) {}
  flush();
  post(result);
}

self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.t === "init") await init(m.bases, m.boot);
    else if (m.t === "run") await run(m.code);
    else if (m.t === "line") { const w = waiter; waiter = null; if (w) w(m.text); }
  } catch (err) { post({ t: "fatal", text: String((err && err.message) || err) }); }
};
</script>

<!-- Python side of input() and time.sleep(). They pause the program (JSPI "run_sync") while you type or wait.
     can_run_sync() only says yes while a program is running, so it is asked each time, not once at start-up. -->
<script type="text/plain" id="py-boot">
import sys, time, builtins
import snail_io
from pyodide.ffi import run_sync, can_run_sync

def _can_wait():
    try:
        return bool(can_run_sync())
    except Exception:
        return False

def _read():
    if not _can_wait():
        raise RuntimeError("this browser can't pause Python to wait for typing")
    line = run_sync(snail_io.read_line())
    if line is None:
        raise EOFError("EOF when reading a line")
    return str(line)

def _input(prompt=""):
    sys.stdout.write(str(prompt))
    sys.stdout.flush()
    return _read()

class _Stdin:
    encoding = "utf-8"
    def isatty(self):
        return True
    def readable(self):
        return True
    def readline(self, size=-1):
        try:
            return _read() + "\n"
        except EOFError:
            return ""
    def __iter__(self):
        return self
    def __next__(self):
        line = self.readline()
        if not line:
            raise StopIteration
        return line

builtins.input = _input
sys.stdin = _Stdin()

_real_sleep = time.sleep
def _sleep(seconds):
    seconds = float(seconds)
    if seconds < 0:
        raise ValueError("sleep length must be non-negative")
    if _can_wait():
        snail_io.flush()
        run_sync(snail_io.sleep(seconds))
    else:
        _real_sleep(seconds)
time.sleep = _sleep
</script>

<script src="snail-core.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const src = $("src"), out = $("out"), nameEl = $("fname");
const form = $("stdin"), lineEl = $("stdin-line"), runBtn = $("run"), mainEl = document.querySelector("main");
const getName = () => nameEl.value.trim() || "untitled.snail";

const SAMPLE = `#ss# copyright snail coding development inc. #
#ss# ver 1.0 ###

#ss## Tap Run to try this.
Each code block runs in its own language. #

<code lang="html en">
<h1>Hello from Snail!</h1>
<p>This page was made by a .snail file.</p>
<code?>

<code lang="js">
console.log("Hello from the JavaScript block!");
console.log(2 + 2);
<code?>
`;

function persist() {
  try { localStorage.setItem("snail:src", src.value); localStorage.setItem("snail:name", getName()); } catch {}
}
function load(name, text) { nameEl.value = name; src.value = text; persist(); }

// ---- Output. It is streamed, so a program's questions show up while it is still running. ----
const MAX_OUT = 400000;                   // keep the last ~400k characters so a chatty program can't fill memory
let atLineStart = true, outLen = 0;
let recent = "";                          // what the program printed since it last asked a question (pop-up fallback)
function emit(text, cls) {
  if (!text) return;
  const stick = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 48;   // follow the output if already at the bottom
  const last = out.lastElementChild;
  if (last && last.className === (cls || "") && last.lastChild && last.lastChild.nodeType === 3) last.lastChild.appendData(text);
  else {
    const s = document.createElement("span");
    s.textContent = text;
    if (cls) s.className = cls;
    out.append(s);
  }
  atLineStart = text.endsWith("\n");
  outLen += text.length;
  while (outLen > MAX_OUT && out.firstChild) {
    const f = out.firstChild, over = outLen - MAX_OUT, t = f.textContent;
    if (t.length <= over) { outLen -= t.length; f.remove(); } else { f.textContent = t.slice(over); outLen -= over; }
  }
  if (stick) mainEl.scrollTop = mainEl.scrollHeight;
}
// Program output is collected and drawn at most ~20 times a second, in order. A program that prints
// non-stop would otherwise keep the page too busy to answer the Stop button.
let outQ = [], outQLen = 0, outTimer = 0;
function flushOut() {
  if (outTimer) { clearTimeout(outTimer); outTimer = 0; }
  const q = outQ; outQ = []; outQLen = 0;
  for (let i = 0; i < q.length;) {
    let t = q[i][0]; const c = q[i][1]; i++;
    while (i < q.length && q[i][1] === c) t += q[i++][0];
    emit(t, c);
  }
}
function log(text, cls) {                 // a message from Snail itself, always on its own line
  flushOut();
  if (!atLineStart) emit("\n");
  emit(text + "\n", cls);
}
function progOut(text, cls) {             // text from the running program
  if (!cls) recent = (recent + text).slice(-4000);
  outQ.push([text, cls || ""]); outQLen += text.length;
  while (outQLen > MAX_OUT && outQ.length > 1) outQLen -= outQ.shift()[0].length;   // runaway program: keep the newest
  if (!outTimer) outTimer = setTimeout(flushOut, 50);
}
function reset() {
  if (outTimer) { clearTimeout(outTimer); outTimer = 0; }
  outQ = []; outQLen = 0;
  out.textContent = ""; $("preview").textContent = ""; atLineStart = true; outLen = 0; recent = "";
}

function parseSrc() {
  try { return Snail.parse(src.value, getName()); }
  catch (e) {
    if (e instanceof Snail.SnailError) { log(`${getName()}: syntax error: ${e.message}`, "err"); return null; }
    throw e;
  }
}
function summary(p) {
  log(`${getName()}: ${p.kind} file, version ${p.version || "not declared"}, ${p.blocks.length} code block(s)`, "dim");
  if (p.version) {
    const v = p.version.split(".").map(Number), s = Snail.SUPPORTED;
    if (v[0] > s[0] || (v[0] === s[0] && (v[1] || 0) > s[1])) log(`warning: file is version ${p.version}, this app knows ${s.join(".")}`, "err");
  }
}

// ---- Typing input for a running program ----
let running = false, stopRequested = false;
let waiting = false;                      // the Python worker is waiting for a line (web / Android / iOS)
let nativeId = null, nativeCount = 0;     // the running process (desktop app)

function showForm(on) {
  form.hidden = !on;
  if (on) {
    lineEl.value = "";
    lineEl.focus();
    if (form.scrollIntoView) form.scrollIntoView({ block: "nearest" });
  }
}
function sendLine() {
  const text = lineEl.value;
  lineEl.value = "";
  if (waiting && worker) {
    waiting = false;
    showForm(false);
    progOut(text + "\n", "typed");
    worker.postMessage({ t: "line", text });
  } else if (nativeId != null && window.snailNative) {
    progOut(text + "\n", "typed");
    window.snailNative.stdin(nativeId, text + "\n");
  }
}
form.onsubmit = (e) => { e.preventDefault(); sendLine(); };
// A preview that isn't allowed to submit forms (Snail running inside Snail) would ignore Enter and Send,
// so they are also handled directly. preventDefault stops the form from sending the line twice.
lineEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendLine(); } });
form.querySelector("button").addEventListener("click", (e) => { e.preventDefault(); sendLine(); });
function stopRun() {
  if (!running) return;
  stopRequested = true;
  stopWorker();                           // ends Python at once, even in an endless loop
  flushOut();
  if (nativeId != null && window.snailNative) window.snailNative.kill(nativeId);
  showForm(false);
}
if (window.snailNative) {
  window.snailNative.onChunk((m) => { if (m.id === nativeId) progOut(m.text, m.err ? "err" : ""); });
}

// ---- Python without a PC: Pyodide (Python compiled to WebAssembly). Bundled by the builds; falls back to a CDN ----
const PY_CDN = "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/";   // keep in step with the version in package.json
const pyBase = () => { try { return new URL("pyodide/", location.href).href; } catch { return null; } };   // the copy bundled by the build (none when the page has no real address, e.g. inside a preview)
const STOP = "stopped by you";
// Pausing Python while you type needs "JSPI" (Chrome and Edge 137+, and the matching Android WebView).
const HAS_JSPI = typeof WebAssembly === "object" && typeof WebAssembly.promising === "function" && typeof WebAssembly.Suspending === "function";
let useWorker = HAS_JSPI && typeof Worker === "function" && typeof Blob === "function" && !!(window.URL && URL.createObjectURL);
let pyReady = false;

// -- Worker route (the normal one) --
let worker = null, ready = null, readyCtl = null, current = null;

function stopWorker() {
  const w = worker;
  worker = null; ready = null; waiting = false;
  if (w) w.terminate();
  if (readyCtl) { readyCtl.reject(new Error(STOP)); readyCtl = null; }
  if (current) { const c = current; current = null; c.resolve({ ok: false, out: "", stopped: true }); }
}
function workerFailed(text) {             // the worker died or couldn't start
  if (readyCtl) { readyCtl.reject(new Error(text)); readyCtl = null; }
  if (current) { const c = current; current = null; c.resolve({ ok: false, out: text }); }
  stopWorker();
}
function ensureWorker() {
  if (ready) return ready;
  const url = URL.createObjectURL(new Blob([$("py-worker").textContent], { type: "text/javascript" }));
  const w = new Worker(url);
  worker = w;
  ready = new Promise((resolve, reject) => { readyCtl = { resolve, reject }; });
  ready.catch(() => {});                  // the caller handles it; this just avoids an "unhandled" warning
  w.onmessage = (e) => {
    if (w !== worker) return;             // a worker that was already stopped
    const m = e.data;
    if (m.t === "out") progOut(m.text, m.err ? "err" : "");
    else if (m.t === "status") log("  " + m.text, "dim");
    else if (m.t === "need-input") { flushOut(); waiting = true; recent = ""; showForm(true); }
    else if (m.t === "ready") { pyReady = true; URL.revokeObjectURL(url); if (readyCtl) { readyCtl.resolve(); readyCtl = null; } }
    else if (m.t === "fatal") workerFailed(m.text);
    else if (m.t === "done") {
      flushOut(); waiting = false; showForm(false);
      if (current) { const c = current; current = null; c.resolve({ ok: m.ok, out: m.error || "" }); }
    }
  };
  w.onerror = (e) => { if (w === worker) workerFailed("Python stopped unexpectedly" + (e && e.message ? ": " + e.message : "")); };
  w.postMessage({ t: "init", bases: [pyBase(), PY_CDN].filter(Boolean), boot: $("py-boot").textContent });
  return ready;
}
async function runPyWorker(code) {
  try { await ensureWorker(); }
  catch (e) {
    const quiet = stopRequested;
    stopWorker();
    return { ok: false, out: quiet ? "" : String((e && e.message) || e) };
  }
  if (!worker) return { ok: false, out: "" };
  return new Promise((resolve) => { current = { resolve }; worker.postMessage({ t: "run", code }); });
}

// -- Fallback route for browsers without JSPI (older Safari/iOS, Firefox): runs on the page, input() asks in a pop-up box --
let mainPyPromise;
function addScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error("could not load " + src));
    document.head.append(el);
  });
}
function installWasmFallback() {          // same safety net as in the worker
  if (installWasmFallback.done || !WebAssembly.instantiateStreaming) return;
  installWasmFallback.done = true;
  const orig = WebAssembly.instantiateStreaming.bind(WebAssembly);
  WebAssembly.instantiateStreaming = async (source, imports) => {
    const resp = await source;
    try { return await orig(resp.clone(), imports); }
    catch (e) { return WebAssembly.instantiate(await resp.arrayBuffer(), imports); }
  };
}
function loadPyMain() {
  if (!mainPyPromise) mainPyPromise = (async () => {
    installWasmFallback();
    let base = pyBase();
    try { if (!base) throw new Error("no bundled copy"); await addScript(base + "pyodide.js"); }
    catch {
      log("  bundled Python not found here; downloading it from the internet instead (needs a connection)...", "dim");
      base = PY_CDN;
      try { await addScript(base + "pyodide.js"); }
      catch { throw new Error("couldn't load the Python runtime, either bundled with the app or from " + PY_CDN + ". Check your internet connection."); }
    }
    const py = await loadPyodide({ indexURL: base });
    pyReady = true;
    return py;
  })();
  mainPyPromise.catch(() => { mainPyPromise = null; });
  return mainPyPromise;
}
function promptLine() {                   // the program asked a question: show what it printed lately in a pop-up
  flushOut();
  const shown = recent.split("\n").slice(-12).join("\n").trim() || "Type your input:";
  recent = "";
  const ans = window.prompt(shown);
  if (ans === null) { stopRequested = true; return undefined; }   // Cancel = end the program
  progOut(ans + "\n", "typed");
  return ans;
}
async function runPyMain(code) {
  let py;
  try { py = await loadPyMain(); }
  catch (e) { return { ok: false, out: String((e && e.message) || e) }; }
  const dec = new TextDecoder(), decErr = new TextDecoder();
  py.setStdout({ write: (buf) => { progOut(dec.decode(buf, { stream: true })); return buf.length; }, isatty: true });
  py.setStderr({ write: (buf) => { progOut(decErr.decode(buf, { stream: true }), "err"); return buf.length; }, isatty: true });
  py.setStdin({ stdin: promptLine });
  const scope = py.globals.get("dict")();
  scope.set("__name__", "__main__");
  try {
    await py.runPythonAsync(code, { globals: scope });
    return { ok: true, out: "" };
  } catch (e) {
    if (e && e.type === "SystemExit") return { ok: true, out: "" };
    if (stopRequested) return { ok: false, out: "" };
    return { ok: false, out: String((e && e.message) || e).trim() };
  } finally { scope.destroy(); }
}

async function runPy(code) {
  if (!pyReady) log("  starting Python (the first run takes a few seconds)...", "dim");
  if (useWorker) {
    try { return await runPyWorker(code); }
    catch (e) { useWorker = false; }      // the browser wouldn't start a worker; use the fallback instead
  }
  return runPyMain(code);
}

// ---- Java without a PC: compiled and run on a free public service (Judge0 CE). Your code is sent to it. ----
const JAVA_SERVICE = "https://ce.judge0.com";   // change this if you host your own Judge0
const b64 = (s) => { let t = ""; new TextEncoder().encode(s).forEach((c) => (t += String.fromCharCode(c))); return btoa(t); };
const unb64 = (s) => (s ? new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0))) : "");

// The service only runs a class called Main, so adapt the code without touching its text.
function javaSource(code) {
  const MAIN = /\bstatic\s+void\s+main\s*\(/;
  const at = code.search(MAIN);
  if (at < 0) {                       // bare statements: hoist imports, wrap the rest in main()
    const lines = code.split("\n"), isImp = (l) => /^\s*import\s/.test(l);
    return lines.filter(isImp).join("\n") + "\npublic class Main {\n  public static void main(String[] args) throws Exception {\n" +
           lines.filter((l) => !isImp(l)).join("\n") + "\n  }\n}\n";
  }
  const before = code.slice(0, at);
  const tops = [...before.matchAll(/^(?:public\s+)?(?:(?:final|abstract)\s+)*class\s+(\w+)/gm)];
  const any = [...before.matchAll(/\bclass\s+(\w+)/g)];
  const pick = tops.length ? tops[tops.length - 1] : any[any.length - 1];
  const cls = pick ? pick[1] : "Main";
  let src = code.replace(/^([ \t]*)public\s+((?:(?:final|abstract|strictfp)\s+)*(?:class|interface|enum|record)\b)/gm, "$1$2");
  if (cls !== "Main") src += `\npublic class Main {\n  public static void main(String[] args) throws Exception { ${cls}.main(args); }\n}\n`;
  return src;
}

function javaConsent() {
  try { if (localStorage.getItem("snail:java-ok") === "1") return true; } catch {}
  const ok = confirm("Java can't run inside this app.\n\nTo run it, the code in your java block is sent over the internet to a free public service (" +
                     JAVA_SERVICE + "), which compiles and runs it.\n\nDon't do this with code that contains secrets. Allow it?");
  if (ok) { try { localStorage.setItem("snail:java-ok", "1"); } catch {} }
  return ok;
}

async function runJavaOnline(code) {
  if (!javaConsent()) return { ok: false, out: "Java not run: you chose not to send code to the online service." };
  log("  sending to the online Java service...", "dim");
  try {
    const langs = await (await fetch(JAVA_SERVICE + "/languages")).json();
    const lang = langs.find((l) => /^Java \(/.test(l.name));
    if (!lang) throw new Error("the service doesn't offer Java right now");
    const post = await fetch(JAVA_SERVICE + "/submissions?base64_encoded=true", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ language_id: lang.id, source_code: b64(javaSource(code)) }),
    });
    if (post.status === 429) return { ok: false, out: "The free Java service is rate-limiting you. Wait a minute and try again." };
    if (!post.ok) throw new Error("HTTP " + post.status);
    const { token } = await post.json();
    for (let i = 0; i < 40; i++) {
      await new Promise((r) => setTimeout(r, 800));
      const res = await (await fetch(`${JAVA_SERVICE}/submissions/${token}?base64_encoded=true`)).json();
      if (res.status && res.status.id > 2) {
        const ok = res.status.id === 3;
        let out = unb64(res.compile_output) + unb64(res.stdout) + unb64(res.stderr) + unb64(res.message);
        if (!ok) out += `\n(${res.status.description})`;
        return { ok, out };
      }
    }
    return { ok: false, out: "The online Java service took too long to answer." };
  } catch (e) {
    return { ok: false, out: `Couldn't reach the online Java service (${JAVA_SERVICE}): ${(e && e.message) || e}\nIt may be offline, busy, or blocking this page. Java always works in the desktop app.` };
  }
}

$("check").onclick = () => {
  if (running) return;
  reset();
  const p = parseSrc(); if (!p) return;
  summary(p);
  p.blocks.forEach((b, i) => log(`  block ${i + 1}: ${b.lang}${b.extras.length ? " (" + b.extras.join(" ") + ")" : ""}, line ${b.line}, ${b.body.split("\n").length} line(s)`));
};

runBtn.onclick = async () => {
  if (running) { stopRun(); return; }     // while a program runs, this button is "Stop"
  running = true; stopRequested = false;
  runBtn.textContent = "Stop"; runBtn.classList.add("stop");
  reset();
  try {
    const p = parseSrc(); if (!p) return;
    summary(p);
    for (let i = 0; i < p.blocks.length; i++) {
      const b = p.blocks[i], n = i + 1;
      log(`[block ${n}] running ${b.lang}`);
      let r;
      if (b.lang === "html") {
        const f = document.createElement("iframe");
        f.setAttribute("sandbox", "allow-scripts allow-downloads allow-modals");
        f.srcdoc = Snail.htmlPage(b, getName());
        $("preview").append(f);
        r = { ok: true, out: "  shown below" };
      } else if (b.lang === "js" || b.lang === "javascript") {
        r = Snail.runJs(b.body);
      } else if (window.snailNative) {
        nativeId = ++nativeCount;                                // desktop app: java, python as real processes
        showForm(true);
        try { r = await window.snailNative.run(b.lang, b.body, n, nativeId); }
        finally { nativeId = null; showForm(false); }
      } else if (b.lang === "python" || b.lang === "py") {
        r = await runPy(b.body);                                  // web + Android + iOS: bundled Pyodide
      } else if (b.lang === "java") {
        r = await runJavaOnline(b.body);                          // web + Android + iOS: online service
      } else {
        r = { ok: false, out: `'${b.lang}' blocks can't run here. This app runs html, js, python and java.` };
      }
      if (stopRequested) { log("[stopped]", "dim"); return; }
      if (r.out) log(r.out.replace(/\n$/, ""), r.ok ? "" : "err");
      if (!r.ok) { log(`stopped: block ${n} (line ${b.line}) failed`, "err"); return; }
    }
  } finally {
    flushOut();
    running = false;
    runBtn.textContent = "Run"; runBtn.classList.remove("stop");
    waiting = false; nativeId = null;
    showForm(false);
  }
};

// ---- Open / Save ----
$("open").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0];
  if (f) load(f.name, await f.text());
  e.target.value = "";
};

$("save").onclick = async () => {
  let name = getName().replace(/[\\/:*?"<>|]/g, "_");
  if (!/\.(snail|cofigsnail|configsnail)$/i.test(name)) name += ".snail";
  nameEl.value = name; persist();
  try {
    const cap = window.Capacitor;
    if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
      // Android / iOS: write the file, then open the share sheet (Files, Drive, email...)
      const { Filesystem, Share } = cap.Plugins;
      const r = await Filesystem.writeFile({ path: name, data: src.value, directory: "CACHE", encoding: "utf8" });
      await Share.share({ title: name, files: [r.uri], dialogTitle: "Save " + name });
    } else {
      // Desktop and web: the normal "Save as" dialog
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([src.value], { type: "text/plain" }));
      a.download = name;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
  } catch (e) { log("save failed: " + ((e && e.message) || e), "err"); }
};

src.addEventListener("input", persist);
nameEl.addEventListener("change", persist);
if (window.snailNative) window.snailNative.onOpen((f) => load(f.name, f.text));

try {
  nameEl.value = localStorage.getItem("snail:name") || nameEl.value;
  src.value = localStorage.getItem("snail:src") ?? SAMPLE;
} catch { src.value = SAMPLE; }
</script>
