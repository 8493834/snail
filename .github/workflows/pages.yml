name: Deploy web preview

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Give this build its own version
        run: node tools/stamp-version.js
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Assemble the site (app + bundled Python runtime)
        run: |
          mkdir _site
          cp -r www/. _site/
          cp -r node_modules/pyodide _site/pyodide
          touch _site/.nojekyll
      - name: Check Snailify works (same output as the Python tool)
        run: |
          for f in snailify.html snailify-core.js snail-core.js; do
            test -f "_site/$f" || { echo "MISSING: $f"; exit 1; }
          done
          mkdir t && cd t
          printf 'const s = "%s";\nconsole.log(s);\n' "<code?>" > a.js
          python3 ../tools/snailify.py a.js --escape -o py.snail
          node -e '
            const fs=require("fs"),S=require("../www/snail-core.js"),F=require("../www/snailify-core.js");
            fs.writeFileSync("js.snail",F.build([{name:"a.js",text:fs.readFileSync("a.js","utf8")}],{escape:true},S).text);'
          cmp py.snail js.snail && echo "snailify: Python and browser versions agree"
          cd .. && rm -rf t
      - name: Check the Python runtime made it into the site
        run: |
          ls -la _site/pyodide | head -20
          for f in pyodide.js pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            test -f "_site/pyodide/$f" || { echo "MISSING: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
