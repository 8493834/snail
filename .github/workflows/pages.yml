name: Deploy web preview

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Assemble the site (app + bundled Python runtime)
        run: |
          mkdir _site
          cp -r www/. _site/
          cp -r node_modules/pyodide _site/pyodide
          touch _site/.nojekyll
      - name: Check the Python runtime made it into the site
        run: |
          ls -la _site/pyodide | head -20
          for f in pyodide.js pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            test -f "_site/pyodide/$f" || { echo "MISSING: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
