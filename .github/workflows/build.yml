name: Build Snail apps

on:
  push:
    branches: [main, master]
    tags: ["v*"]          # publishing a Release (tag like v1.2.0) also builds and attaches the apps
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Give this build its own version
        run: node tools/stamp-version.js
      - run: npm install
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: snail-windows
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Give this build its own version
        run: node tools/stamp-version.js
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Bundle the Python runtime (Pyodide) into the app
        run: |
          cp -r node_modules/pyodide www/pyodide
          test -f www/pyodide/pyodide.js || { echo "MISSING: pyodide.js"; exit 1; }
      - run: npx cap add android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: snail-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Give this build its own version
        run: node tools/stamp-version.js
      - run: npm install
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: snail-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Give this build its own version
        run: node tools/stamp-version.js
      - run: npm install
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: snail-macos
          path: |
            dist/*.dmg
            dist/*.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Give this build its own version
        run: node tools/stamp-version.js
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Bundle the Python runtime (Pyodide) into the app
        run: |
          cp -r node_modules/pyodide www/pyodide
          test -f www/pyodide/pyodide.js || { echo "MISSING: pyodide.js"; exit 1; }
      - run: npx cap add ios
      - name: Let the Files app see saved .snail files
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $P
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $P
      - run: npx cap sync ios
      - name: Build for the iOS Simulator (no signing needed)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package an unsigned .ipa (re-sign it with your Apple ID, e.g. via Sideloadly/AltStore)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -r build/ios-device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr snail-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: snail-ios
          path: |
            snail-ios-unsigned.ipa
            build/ios/Build/Products/Debug-iphonesimulator/App.app

  # Attaches every app that built to a GitHub Release (even if one platform failed).
  # Every build gets its own version (1.2.<run number>) and its own tag, e.g. v1.2.57, marked as the Latest release.
  release:
    if: github.event_name == 'push' && !cancelled()
    needs: [windows, android, linux, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pack the snail command (installable with no token or account)
        run: |
          mkdir -p release
          VERSION=$(node tools/stamp-version.js)
          cd packages/snail
          npm pkg set name=snail-lang
          npm pkg set version="$VERSION"
          npm pkg set snailRepo="$GITHUB_REPOSITORY"
          npm pack --silent
          cp snail-lang-*.tgz ../../release/snail.tgz
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the app files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.ipa' \) -exec cp {} release/ \;
          ls -l release
          test -n "$(ls -A release)" || { echo "no app files were built"; exit 1; }
      - name: Make the .deb installable with apt (sudo apt install snail-code)
        run: sh tools/make-apt-repo.sh release && ls -l release
      - name: Create the Release (every build gets its own version and tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node tools/stamp-version.js)
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --latest \
              --title "Snail $VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
