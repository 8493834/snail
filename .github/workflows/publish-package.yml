name: Publish npm package (GitHub Packages)

# Publishes @<your-username>/snail to https://npm.pkg.github.com
# Runs when you push a tag like v1.2.0, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - name: Name the package after the repo owner and match the app version
        working-directory: packages/snail
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          npm pkg set name="@${OWNER}/snail"
          npm pkg set version="$(node -p "require('../../package.json').version")"
          npm pkg set repository.url="git+https://github.com/${{ github.repository }}.git"
      - name: Quick test of the package
        working-directory: packages/snail
        run: |
          mkdir -p lib && cp ../../www/snail-core.js ../../www/snailify-core.js lib/
          ls -R . | head -30
          printf 'console.log(1);\n' > /tmp/a.js
          node bin/snail.js build /tmp/a.js -o /tmp/a.snail
          node bin/snail.js check /tmp/a.snail
      - name: Publish
        working-directory: packages/snail
        run: |
          # GitHub Packages never lets a version be published twice. If this version is already there, that is fine.
          if npm publish 2>publish.err; then echo "published"; 
          elif grep -q "E409\|Cannot publish over existing version" publish.err; then echo "This version is already published - nothing to do. Raise \"version\" in the top package.json to publish a new one."
          else cat publish.err; exit 1; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: the public npm site. Needs a repository secret called NPM_TOKEN (npm "automation" token).
  # Anyone can then run: npm install -g snail-lang   (no token, no setup).
  npmjs:
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_TO_NPMJS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish snail-lang
        working-directory: packages/snail
        run: |
          npm pkg set name=snail-lang
          npm pkg set version="$(node -p "require('../../package.json').version")"
          npm pkg delete publishConfig
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
